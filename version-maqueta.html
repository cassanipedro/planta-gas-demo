<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planta de Gas Aguada Norte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#0b0807; --fg:#f4f1ea; --muted:#a8a296;
  --glass:rgba(14,11,10,.62); --glass-strong:rgba(14,11,10,.8); --glass-br:rgba(255,255,255,.14);
  --accent:#ff9044; --ok:#3ddc97; --warn:#ffc24b; --bad:#ff6b5e; --maint:#5fb4ff; --trend:#9fd4ff;
  --font-h:'Space Grotesk',system-ui,sans-serif; --font-b:'Inter',system-ui,sans-serif;
  --ease:cubic-bezier(.6,0,.2,1);
  color-scheme:dark;
}
html,body{height:100%;margin:0;}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);overflow:hidden;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;}
button{font:inherit;color:inherit;}

/* ---------- Escena: capas de imagen ---------- */
#stage{position:fixed;inset:0;overflow:hidden;background:var(--bg);touch-action:none;cursor:grab;}
#stage:active{cursor:grabbing;}
.layer{position:absolute;inset:0;opacity:0;pointer-events:none;will-change:transform,opacity,filter;}
.layer.front{pointer-events:auto;}
.drift{position:absolute;inset:0;transform-origin:50% 50%;animation:kb 28s ease-in-out infinite alternate;}
@keyframes kb{from{transform:scale(1.05);}to{transform:scale(1.11) translate(-.6%,-.4%);}}
.foc{position:absolute;inset:0;transform-origin:0 0;}
.par{position:absolute;inset:0;transition:transform .9s cubic-bezier(.2,.7,.2,1);}
.frame{position:absolute;}
.frame img{position:absolute;inset:0;width:100%;height:100%;display:block;-webkit-user-drag:none;}
.pins{position:absolute;inset:0;transition:opacity .5s .1s;}
.layer.busy .pins{opacity:0;pointer-events:none;transition:opacity .15s;}

/* Pines de área (vista aérea) */
.zpin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;
  background:none;border:0;padding:0;cursor:pointer;}
.zpin .lab{display:flex;align-items:center;gap:7px;background:var(--glass);border:1px solid var(--glass-br);
  border-radius:999px;padding:7px 13px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  font-family:var(--font-h);font-weight:600;font-size:12.5px;white-space:nowrap;
  transition:border-color .2s,transform .25s;box-shadow:0 6px 24px rgba(0,0,0,.35);}
.zpin .lab small{font-family:var(--font-b);font-weight:400;font-size:10.5px;color:#d6cfc2;font-variant-numeric:tabular-nums;}
.zpin .lab small b{font-weight:600;color:#fff;}
.zpin.r .lab{transform:translateX(-38%);}
.zpin .stem{width:1px;height:30px;background:linear-gradient(rgba(255,255,255,.85),rgba(255,255,255,.15));}
.zpin .pt{width:11px;height:11px;border-radius:50%;background:var(--hsc);margin-bottom:-5.5px;
  box-shadow:0 0 0 3px rgba(0,0,0,.28),0 0 16px 2px var(--hsc);position:relative;}
.zpin .pt::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid var(--hsc);
  animation:pulse 2.6s ease-out infinite;}
.zpin.b{transform:translate(-50%,0);flex-direction:column-reverse;}
.zpin.b .pt{margin:-5.5px 0 0;}
.zpin.b .stem{background:linear-gradient(rgba(255,255,255,.15),rgba(255,255,255,.85));}
.zpin:hover .lab,.zpin.hl .lab{border-color:var(--accent);transform:translateY(-3px);}
.zpin.r:hover .lab,.zpin.r.hl .lab{transform:translate(-38%,-3px);}
.zpin:focus-visible{outline:none;}
.zpin:focus-visible .lab{outline:2px solid var(--accent);outline-offset:2px;}

/* Hotspots de equipos (vista de área) */
.hs{position:absolute;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;border:0;
  background:transparent;cursor:pointer;padding:0;transform:scale(var(--k,1));
  transition:transform 1.1s var(--ease);}
.hs i{position:absolute;inset:13px;border-radius:50%;background:var(--hsc);
  box-shadow:0 0 0 3px rgba(0,0,0,.3),0 0 16px 4px var(--hsc);transition:inset .2s;}
.hs::before{content:"";position:absolute;inset:5px;border-radius:50%;border:1.5px solid var(--hsc);
  animation:pulse 2.4s ease-out infinite;}
.hs span{position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%);
  background:var(--glass-strong);border:1px solid var(--glass-br);border-radius:8px;padding:5px 10px;
  font-size:11.5px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none;
  backdrop-filter:blur(10px);}
.hs:hover span,.hs.hl span,.hs.sel span,.hs:focus-visible span{opacity:1;}
.hs:hover i,.hs.hl i,.hs.sel i{inset:10px;}
.hs.sel::before{border-width:2px;animation-duration:1.4s;}
.hs:focus-visible{outline:none;}
@keyframes pulse{0%{transform:scale(.6);opacity:.9;}70%{transform:scale(1.6);opacity:0;}100%{opacity:0;}}

/* ---------- Capas de cine ---------- */
#vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 75% 70% at 50% 45%,transparent 55%,rgba(8,5,3,.55) 100%),
             linear-gradient(to bottom,rgba(8,5,3,.5),transparent 20%,transparent 72%,rgba(8,5,3,.6));}
#grain{position:fixed;inset:-50%;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain 1s steps(5) infinite;}
@keyframes grain{0%{transform:translate(0,0);}20%{transform:translate(-3%,2%);}40%{transform:translate(2%,-3%);}
  60%{transform:translate(-2%,-1%);}80%{transform:translate(3%,3%);}100%{transform:translate(0,0);}}
#bars::before,#bars::after{content:"";position:fixed;left:0;right:0;height:0;background:#000;z-index:3;
  pointer-events:none;transition:height .7s var(--ease);}
#bars::before{top:0;} #bars::after{bottom:0;}
body.cine #bars::before,body.cine #bars::after{height:6.5vh;}

/* ---------- Intro ---------- */
#intro{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;transition:opacity 1s .2s;text-align:center;padding:0 24px;}
#intro.gone{opacity:0;pointer-events:none;}
#intro .t{font-family:var(--font-h);font-weight:700;font-size:22px;letter-spacing:.4px;}
#intro .bar{width:160px;height:2px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden;}
#intro .bar i{display:block;height:100%;width:40%;background:var(--accent);animation:load 1.1s ease-in-out infinite;}
@keyframes load{from{transform:translateX(-100%);}to{transform:translateX(250%);}}
#intro small{color:var(--muted);font-size:12px;}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity 1.2s;}
body.ready #hud{opacity:1;}
#hud > *{pointer-events:auto;}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--glass-br);
  border-radius:999px;padding:9px 16px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  font-size:13px;cursor:pointer;transition:border-color .2s,background .2s;white-space:nowrap;}
.pill:hover{border-color:rgba(255,255,255,.42);}
.pill:focus-visible,.chip:focus-visible,#zpanel button:focus-visible,#card .close:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.pill.static{cursor:default;}
.pill.icon{padding:9px 13px;}
.pill.on{background:var(--accent);border-color:var(--accent);color:#14100a;font-weight:600;}
.pill .cnt{display:inline-flex;gap:9px;color:#e6ddcf;font-variant-numeric:tabular-nums;}
.pill .cnt span{display:inline-flex;align-items:center;gap:4px;}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;}
#topleft{position:absolute;top:max(14px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  display:flex;gap:8px;align-items:center;}
#topright{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;gap:8px;}
#topcenter{position:absolute;top:max(14px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none;transition:opacity .4s;}
#topcenter .t{font-family:var(--font-h);font-weight:700;font-size:clamp(17px,2.4vw,24px);letter-spacing:.3px;
  text-shadow:0 2px 18px rgba(0,0,0,.85);white-space:nowrap;}
#summary{position:absolute;left:50%;transform:translateX(-50%);bottom:max(66px,calc(env(safe-area-inset-bottom,0px) + 54px));
  display:flex;gap:6px;transition:opacity .4s;}
body.zone #summary{opacity:0;pointer-events:none;}
#summary span{display:inline-flex;flex-direction:column;align-items:center;background:var(--glass);border:1px solid var(--glass-br);
  border-radius:12px;padding:5px 12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);min-width:92px;}
#summary small{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;}
#summary b{font-family:var(--font-h);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;}
#summary b em{font-style:normal;font-family:var(--font-b);font-weight:400;font-size:10.5px;color:var(--muted);margin-left:3px;}
#summary span.warn b{color:var(--warn);}
#bottombar{position:absolute;bottom:max(16px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
  display:flex;gap:7px;max-width:calc(100vw - 24px);overflow-x:auto;padding:4px;scrollbar-width:none;
  transition:opacity .3s;touch-action:pan-x;}
#bottombar::-webkit-scrollbar{display:none;}
.chip{flex:none;background:var(--glass);border:1px solid var(--glass-br);border-radius:999px;padding:8px 14px;
  font-size:12.5px;cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:inline-flex;align-items:center;gap:7px;transition:border-color .15s,background .15s;}
.chip:hover{border-color:rgba(255,255,255,.42);}
.chip.active{background:var(--accent);border-color:var(--accent);color:#14100a;font-weight:600;}
.chip.active .dot{background:#14100a !important;}
#help{font-size:11.5px;color:#e6ddcf;text-shadow:0 1px 8px rgba(0,0,0,.95);white-space:nowrap;transition:opacity .4s;}
body.zone #help{opacity:0;}

/* Indicadores (tiles con tendencia) */
.kt{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:8px 10px 7px;min-width:0;
  transition:border-color .4s,background .4s;}
.kt > span{display:block;font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kv{display:flex;align-items:baseline;gap:4px;margin:2px 0 3px;white-space:nowrap;}
.kv b{font-family:var(--font-h);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;transition:color .4s;}
.kv small{font-size:10.5px;color:var(--muted);}
.kt svg{display:block;width:100%;height:24px;color:var(--trend);overflow:visible;transition:color .4s;}
.kt em{display:block;font-style:normal;font-size:9.5px;color:var(--muted);margin-top:3px;white-space:nowrap;}
.kt.warn{border-color:rgba(255,194,75,.5);background:rgba(255,194,75,.09);}
.kt.warn .kv b,.kt.warn svg{color:var(--warn);}
.sec{display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  font-weight:600;margin:12px 0 7px;}
.live{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:blink 1.6s ease-in-out infinite;}
@keyframes blink{50%{opacity:.25;}}

/* Panel de área (lower third) */
#zpanel{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:max(72px,calc(env(safe-area-inset-bottom,0px) + 60px));
  width:330px;max-height:calc(100vh - 160px);overflow:auto;box-sizing:border-box;background:var(--glass);border:1px solid var(--glass-br);
  border-radius:18px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:16px 16px 8px;scrollbar-width:thin;
  opacity:0;transform:translateY(18px);pointer-events:none;transition:opacity .5s,transform .6s var(--ease);}
#zpanel.on{opacity:1;transform:none;pointer-events:auto;}
#zpanel .kick{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;}
#zpanel h2{margin:4px 0 2px;font-family:var(--font-h);font-size:20px;font-weight:700;line-height:1.15;}
#zpanel .desc{margin:0;font-size:12.5px;color:var(--muted);}
#zpanel .zk{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
#zpanel .zk .kt{padding:7px 8px 6px;}
#zpanel .zk .kv b{font-size:15.5px;}
#zpanel .zk svg{height:16px;}
#zpanel .zk em{display:none;}
#zpanel ul{list-style:none;margin:0;padding:0;}
#zpanel li button{width:100%;display:flex;align-items:center;gap:9px;background:none;border:0;
  border-top:1px solid rgba(255,255,255,.07);padding:8px 2px;cursor:pointer;text-align:left;font-size:12.5px;}
#zpanel li button:hover span{color:#fff;}
#zpanel li span{flex:1;min-width:0;color:#e2dbcf;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#zpanel li em{font-style:normal;font-size:11px;font-weight:600;white-space:nowrap;}

/* Ficha de equipo */
#card{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(72px,calc(env(safe-area-inset-bottom,0px) + 60px));
  width:min(460px,calc(100vw - 32px));max-height:calc(100vh - 150px);overflow:auto;box-sizing:border-box;
  background:var(--glass-strong);border:1px solid var(--glass-br);scrollbar-width:thin;
  border-radius:18px;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);padding:16px 18px 12px;
  opacity:0;transform:translateY(22px);pointer-events:none;transition:opacity .35s,transform .45s var(--ease);z-index:6;}
#card.on{opacity:1;pointer-events:auto;transform:none;}
#card .head{display:flex;align-items:center;gap:12px;padding-right:22px;}
.glyph{width:44px;height:44px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-h);font-weight:700;font-size:14px;color:#0b0d10;}
#card .tt{flex:1;min-width:0;}
#card h3{margin:0;font-family:var(--font-h);font-size:16.5px;font-weight:600;}
#card .amb{margin:1px 0 0;font-size:12px;color:var(--muted);}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:600;flex:none;}
#card .close{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--muted);font-size:19px;cursor:pointer;padding:4px;line-height:1;}
#card .close:hover{color:var(--fg);}
#card .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;}
.health{margin:13px 0 0;}
.health .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:5px;}
.health .bar{height:6px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;}
.health .bar i{display:block;height:100%;border-radius:4px;}
.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 12px;font-size:12px;}
.specs span{display:block;font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:1px;}
.specs b{font-weight:500;word-break:break-word;}
.specs .hot b{color:var(--accent);}
.note{margin:11px 0 0;padding:9px 12px;border-left:3px solid var(--warn);background:rgba(255,194,75,.09);
  border-radius:0 9px 9px 0;font-size:12.5px;line-height:1.45;}
.hist{margin:10px 0 0;font-size:12px;}
.hist div{display:flex;gap:10px;padding:5px 0;border-top:1px solid rgba(255,255,255,.07);}
.hist time{color:var(--muted);font-variant-numeric:tabular-nums;flex:none;}

.only-wide{display:inline-flex;}
body.aerial .zone-only{display:none !important;}
body.zone .aerial-only{display:none !important;}

@media (max-width:1100px){ #summary span:nth-child(n+4){display:none;} }
@media (max-width:760px){
  .only-wide{display:none;}
  #help{display:none;}
  body.zone #topcenter{opacity:0;}
  #topcenter{top:max(62px,calc(env(safe-area-inset-top,0px) + 52px));}
  #topcenter .t{font-size:17px;white-space:normal;text-align:center;width:calc(100vw - 40px);}
  #summary span{min-width:0;padding:5px 9px;}
  #summary span:nth-child(n+3){display:none;}
  #zpanel{width:auto;right:max(16px,env(safe-area-inset-right,0px));padding:12px 14px 4px;}
  #zpanel ul,#zpanel .desc{display:none;}
  #zpanel h2{font-size:18px;}
  #card{right:16px;left:16px;width:auto;bottom:max(16px,env(safe-area-inset-bottom,0px));max-height:64vh;}
  .specs{grid-template-columns:repeat(2,1fr);}
  body.carded #zpanel,body.carded #bottombar{opacity:0;pointer-events:none;}
}
@media (prefers-reduced-motion:reduce){
  .drift,#grain,.hs::before,.zpin .pt::after,.live{animation:none;}
}
</style>
</head>
<body class="aerial">
<div id="stage" aria-label="Vista del yacimiento y la planta de gas"></div>
<div id="vignette"></div>
<div id="grain"></div>
<div id="bars"></div>

<div id="hud">
  <div id="topleft"></div>
  <div id="topcenter">
    <div class="t">Planta de Tratamiento de Gas · Aguada Norte</div>
    <div id="help">Tocá un área para volar hacia ella · arrastrá para recorrer</div>
  </div>
  <div id="topright"><button class="pill" id="tourBtn" aria-pressed="false"></button></div>
  <div id="summary"></div>
  <div id="zpanel" aria-live="polite"></div>
  <div id="bottombar"></div>
  <div id="card" role="dialog" aria-label="Ficha de equipo"></div>
</div>

<div id="intro"><div class="t">Planta de Tratamiento de Gas · Aguada Norte</div><div class="bar"><i></i></div><small>Cargando gemelo digital…</small></div>

<script>
'use strict';
/* ============ Indicadores simulados en vivo ============ */
const KREG=[];
/* k(etiqueta, unidad, valor nominal, decimales, mín. operativo, máx. operativo, ruido) */
function k(label,u,v,d=1,lo=null,hi=null,n){
  const o={label,u,v,d,lo,hi,n:n??(Math.abs(v)*.004+Math.pow(10,-d)*.6),cur:v,hist:[]};
  o.i=KREG.push(o)-1; return o;
}
const ESTADOS={
  'Operativo':{c:'#3ddc97'},'Alerta':{c:'#ffc24b'},
  'Mantenimiento':{c:'#5fb4ff'},'Fuera de servicio':{c:'#ff6b5e'}};
const SEV={'Operativo':0,'Mantenimiento':1,'Alerta':2,'Fuera de servicio':3};

/* x,y: posición del área en la imagen aérea (%) */
const ZONES=[
  {id:'pad',nombre:'Pad de pozos AN-12',x:15,y:69,desc:'Gas no convencional · 4 pozos horizontales',
   kpis:[k('Producción del pad','MMm³/d',1.62,2,1.4,1.9),k('Presión de cabeza','bar',180,0,150,210),k('Agua de flowback','m³/d',46,0,0,80)]},
  {id:'slug',nombre:'Slug catcher y colector',x:12.5,y:36,desc:'Recepción de gas de 6 pads',
   kpis:[k('Gas de entrada','MMm³/d',6.92,2,6,7.5),k('Presión de llegada','bar',74.5,1,65,85),k('Líquidos','%',38,0,10,70)]},
  {id:'separacion',nombre:'Separación de entrada',x:28,y:44,desc:'Remoción de líquidos y partículas',
   kpis:[k('Condensado','m³/d',420,0,300,520),k('Agua de producción','m³/d',85,0,0,140),k('ΔP filtros','bar',.86,2,0,.8,.012)]},
  {id:'aminas',nombre:'Endulzamiento con aminas',x:38.5,y:27,al:'r',desc:'Remoción de CO₂ · MDEA 45 %',
   kpis:[k('CO₂ entrada','%',3.8,2,0,4.5),k('CO₂ salida','%',1.6,2,0,2),k('Carga de amina','mol/mol',.42,2,0,.5)]},
  {id:'deshidratacion',nombre:'Deshidratación con TEG',x:53,y:29,desc:'Ajuste de contenido de agua',
   kpis:[k('Agua en gas','mg/Sm³',58,0,0,65),k('Pureza TEG','%',99.2,1,98.8,100,.04),k('Circulación TEG','m³/h',4.6,1,3.5,6)]},
  {id:'dewpoint',nombre:'Ajuste de punto de rocío',x:61,y:37,desc:'Turboexpansión criogénica · recuperación de NGL',

   marca:'Ignición FFG · 3 pilotos',serie:'TAG PTG-FL01-PI',criticidad:'Alta',instalado:'2023',ultInsp:'20/11/2026',proxMant:'28/11/2026',
   nota:'Termocupla del piloto 2 sin señal. Verificación y recambio programados.',
   kpis:[k('Pilotos con llama','de 3',2,0,3,3,0),k('Temp. piloto 1','°C',612,0,400,null),k('Temp. piloto 3','°C',598,0,400,null)],
   hist:[['20/11/2026','Pérdida de señal TC piloto 2 · OT generada']]},
  {id:'kodrum',g:'KO',nombre:'KO drum V-950',tipo:'Venteo y seguridad',st:'antorcha',hx:32.5,hy:65,estado:'Operativo',salud:86,
   marca:'Separador de líquidos horizontal',serie:'TAG PTG-V950',criticidad:'Media',instalado:'2023',ultInsp:'07/2026',proxMant:'07/2027',nota:'',
   kpis:[k('Nivel','%',18,0,0,60),k('Presión','bar',.4,2,0,1.5)],
   hist:[['07/2026','Drenaje y prueba de alarma de nivel']]},
];
const AZ=id=>ASSETS.filter(a=>a.st===id);
const worst=id=>AZ(id).reduce((w,a)=>SEV[a.estado]>SEV[w]?a.estado:w,'Operativo');
const imgOf=v=>v.type==='aerial'?'img/gas/aerea.jpg':`img/gas/${v.id}.jpg`;

const NF={};
const fmt=(v,d)=>(NF[d]??=new Intl.NumberFormat('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d})).format(v);
const outOf=o=>(o.lo!=null&&o.cur<o.lo)||(o.hi!=null&&o.cur>o.hi);
const rangeTxt=o=>o.lo!=null&&o.hi!=null?(o.lo===o.hi?`Objetivo ${fmt(o.lo,o.d)}`:`Rango ${fmt(o.lo,o.d)} – ${fmt(o.hi,o.d)}`)
  :o.hi!=null?`Máx. ${fmt(o.hi,o.d)}`:o.lo!=null?`Mín. ${fmt(o.lo,o.d)}`:'Sin límite';
const gauss=()=>(Math.random()+Math.random()+Math.random()-1.5)*1.15;
function tickAll(){
  for(const o of KREG){
    if(o.n>0) o.cur+=(o.v-o.cur)*.15+gauss()*o.n;
    o.hist.push(o.cur); if(o.hist.length>48) o.hist.shift();
  }
}
for(let i=0;i<48;i++) tickAll();
function sparkPts(o){
  const h=o.hist; let mn=Math.min(...h), mx=Math.max(...h);
  const pad=(mx-mn)*.2||Math.abs(o.v)*.01||1; mn-=pad; mx+=pad;
  return h.map((y,i)=>`${(i/(h.length-1)*100).toFixed(1)},${(29-(y-mn)/(mx-mn)*28).toFixed(1)}`).join(' ');
}
const tile=o=>`<div class="kt${outOf(o)?' warn':''}" data-kt="${o.i}"><span title="${o.label}">${o.label}</span>
  <div class="kv"><b data-kv="${o.i}">${fmt(o.cur,o.d)}</b><small>${o.u}</small></div>
  <svg viewBox="0 0 100 30" preserveAspectRatio="none" data-ks="${o.i}" aria-hidden="true"><polyline fill="none" stroke="currentColor" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round" points="${sparkPts(o)}"/></svg>
  <em>${rangeTxt(o)}</em></div>`;
function refreshLive(){
  document.querySelectorAll('[data-kv]').forEach(el=>{const o=KREG[el.dataset.kv]; el.textContent=fmt(o.cur,o.d);});
  document.querySelectorAll('[data-ks]').forEach(el=>{el.firstElementChild.setAttribute('points',sparkPts(KREG[el.dataset.ks]));});
  document.querySelectorAll('[data-kt]').forEach(el=>el.classList.toggle('warn',outOf(KREG[el.dataset.kt])));
}
setInterval(()=>{ if(document.hidden) return; tickAll(); refreshLive(); },1300);

/* ============ Motor de capas ============ */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const EASE='cubic-bezier(.6,0,.2,1)';
const AR=2400/1358;
const stage=$('#stage'), card=$('#card'), zpanel=$('#zpanel');
let vw=0,vh=0,fw=0,fh=0;
let mode='aerial', currentZone=null, selected=null, busy=false;

function mkLayer(){
  const el=document.createElement('div'); el.className='layer';
  el.innerHTML='<div class="drift"><div class="foc"><div class="par"><div class="frame">'+
    '<img alt="" draggable="false"><div class="pins"></div></div></div></div></div>';
  stage.appendChild(el);
  return {el,drift:el.querySelector('.drift'),foc:el.querySelector('.foc'),par:el.querySelector('.par'),
    frame:el.querySelector('.frame'),img:el.querySelector('img'),pins:el.querySelector('.pins'),px:0,py:0,view:null};
}
const L=[mkLayer(),mkLayer()]; let front=0;
const F=()=>L[front];

function layout(){
  vw=innerWidth; vh=innerHeight;
  if(vw/vh>AR){fw=vw;fh=vw/AR;} else {fh=vh;fw=vh*AR;}
  L.forEach(place);
  if(selected) focusAsset(selected,true);
}
function place(l){
  const mx=(fw-vw)/2, my=(fh-vh)/2;
  l.px=clamp(l.px,-mx,mx); l.py=clamp(l.py,-my,my);
  const s=l.frame.style;
  s.width=fw+'px'; s.height=fh+'px';
  s.left=(vw-fw)/2+l.px+'px'; s.top=(vh-fh)/2+l.py+'px';
}
function panTo(l,x,y){ l.px=fw*(.5-x/100); l.py=fh*(.5-y/100); place(l); }

function setView(l,view){
  l.view=view;
  l.img.src=imgOf(view);
  l.img.alt=view.type==='aerial'?'Vista aérea del yacimiento y la planta de gas':ZBY[view.id].nombre;
  l.pins.innerHTML=''; l.pins.style.removeProperty('--k');
  if(view.type==='aerial'){
    ZONES.forEach(z=>{
      const c=ESTADOS[worst(z.id)].c, b=document.createElement('button'), h=z.kpis[0];
      b.className='zpin'+(z.x>86||z.al==='r'?' r':'')+(z.y<22?' b':''); b.dataset.z=z.id;
      b.style.left=z.x+'%'; b.style.top=z.y+'%'; b.style.setProperty('--hsc',c);
      b.setAttribute('aria-label',`Volar a ${z.nombre}`);
      b.innerHTML=`<span class="lab"><i class="dot" style="background:${c}"></i>${z.nombre}<small><b data-kv="${h.i}">${fmt(h.cur,h.d)}</b> ${h.u}</small></span><span class="stem"></span><span class="pt"></span>`;
      b.addEventListener('click',()=>goZone(z.id));
      l.pins.appendChild(b);
    });
  } else {
    AZ(view.id).forEach(a=>{
      const b=document.createElement('button');
      b.className='hs'; b.dataset.a=a.id;
      b.style.left=a.hx+'%'; b.style.top=a.hy+'%'; b.style.setProperty('--hsc',ESTADOS[a.estado].c);
      b.setAttribute('aria-label',`${a.nombre} · ${a.estado}`);
      b.innerHTML=`<i></i><span>${a.nombre}</span>`;
      b.addEventListener('click',()=>openAsset(a));
      l.pins.appendChild(b);
    });
  }
  l.foc.style.transition='none'; l.foc.style.transform='';
  l.drift.style.animation='none'; void l.drift.offsetWidth; l.drift.style.animation='';
}
function pinCenter(l,sel){
  const r=l.pins.querySelector(sel).getBoundingClientRect();
  return [r.left+r.width/2, r.top+r.height/2];
}
function zoneCenter(id){
  const as=AZ(id);
  return [as.reduce((s,a)=>s+a.hx,0)/as.length, as.reduce((s,a)=>s+a.hy,0)/as.length];
}
const play=(el,kf,dur,easing=EASE)=>el.animate(kf,{duration:dur,easing,fill:'forwards'}).finished.catch(()=>{});

/* Transición entre niveles: 'in' = vuelo de la aérea a un área, 'out' = regreso a la aérea */
async function swap(kind,view,zid,dur){
  busy=true; document.body.classList.add('cine');
  const from=F(), to=L[1-front], cx=vw/2, cy=vh/2;
  let origin=kind==='in'?pinCenter(from,`[data-z="${zid}"] .pt`):null;
  setView(to,view);
  if(kind==='in') panTo(to,...zoneCenter(zid)); else panTo(to,ZBY[zid].x,ZBY[zid].y);
  await to.img.decode().catch(()=>{});
  if(kind==='out') origin=pinCenter(to,`[data-z="${zid}"] .pt`);
  from.el.classList.add('busy'); to.el.classList.add('busy');
  const [px,py]=origin, fly=`translate(${cx-px}px,${cy-py}px) scale(3.2)`;
  let a,b;
  if(RM){
    from.el.style.zIndex=1; to.el.style.zIndex=2;
    a=Promise.resolve(); b=play(to.el,[{opacity:0},{opacity:1}],380,'ease');
  } else if(kind==='in'){
    from.el.style.zIndex=2; to.el.style.zIndex=1;
    from.el.style.transformOrigin=`${px}px ${py}px`; to.el.style.transformOrigin='50% 50%';
    a=play(from.el,[{transform:'translate(0,0) scale(1)',opacity:1,filter:'blur(0px)'},{opacity:1,offset:.5},
                    {transform:fly,opacity:0,filter:'blur(8px)'}],dur);
    b=play(to.el,[{transform:'scale(.92)',opacity:1,filter:'blur(10px)'},{transform:'scale(1)',opacity:1,filter:'blur(0px)'}],dur);
  } else {
    from.el.style.zIndex=1; to.el.style.zIndex=2;
    to.el.style.transformOrigin=`${px}px ${py}px`; from.el.style.transformOrigin='50% 50%';
    b=play(to.el,[{transform:fly,opacity:0,filter:'blur(8px)'},{opacity:1,offset:.45},
                  {transform:'translate(0,0) scale(1)',opacity:1,filter:'blur(0px)'}],dur);
    a=play(from.el,[{transform:'scale(1)',filter:'blur(0px)'},{transform:'scale(.95)',filter:'blur(8px)'}],dur);
  }
  await Promise.all([a,b]);
  [from,to].forEach(l=>l.el.getAnimations().forEach(x=>x.cancel()));
  from.el.style.opacity='0'; from.el.style.zIndex=0; from.el.classList.remove('front');
  from.par.style.transform='';
  to.el.style.opacity='1'; to.el.style.zIndex=1; to.el.classList.add('front');
  front=1-front;
  to.el.classList.remove('busy'); from.el.classList.remove('busy');
  document.body.classList.remove('cine');
  busy=false;
}

/* ============ Navegación ============ */
async function goZone(id){
  if(busy||(mode==='zone'&&currentZone===id)) return;
  closeCard();
  if(mode==='zone') await goOverview(1100);
  mode='zone'; currentZone=id; updateHud();
  await swap('in',{type:'zone',id},id,1700);
  zpanel.classList.add('on');
}
async function goOverview(dur=1600){
  if(busy||mode==='aerial') return;
  closeCard();
  const zid=currentZone; mode='aerial'; currentZone=null; updateHud();
  await swap('out',{type:'aerial'},zid,dur);
}
function step(d){
  const i=ZONES.findIndex(z=>z.id===currentZone);
  goZone(ZONES[(i+d+ZONES.length)%ZONES.length].id);
}

/* ============ HUD ============ */
const topleft=$('#topleft'), bottombar=$('#bottombar'), tourBtn=$('#tourBtn');
function buildStatic(){
  const n=s=>ASSETS.filter(a=>a.estado===s).length;
  $('#summary').innerHTML=PLANT.map(o=>`<span data-kt="${o.i}" class="${outOf(o)?'warn':''}"><small>${o.label}</small><b><b data-kv="${o.i}">${fmt(o.cur,o.d)}</b><em>${o.u}</em></b></span>`).join('');
  bottombar.innerHTML=ZONES.map(z=>`<button class="chip" data-z="${z.id}"><i class="dot" style="background:${ESTADOS[worst(z.id)].c}"></i>${z.nombre}</button>`).join('');
  bottombar.querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('click',()=>goZone(c.dataset.z));
    c.addEventListener('mouseenter',()=>F().pins.querySelector(`[data-z="${c.dataset.z}"]`)?.classList.add('hl'));
    c.addEventListener('mouseleave',()=>F().pins.querySelector(`[data-z="${c.dataset.z}"]`)?.classList.remove('hl'));
  });
  const cnt=Object.keys(ESTADOS).map(s=>`<span title="${s}"><i class="dot" style="background:${ESTADOS[s].c}"></i>${n(s)}</span>`).join('');
  topleft.innerHTML=`<span class="pill static aerial-only only-wide">${ASSETS.length} equipos <span class="cnt">${cnt}</span></span>
    <button class="pill zone-only" id="backBtn">‹ Vista aérea</button>
    <button class="pill icon zone-only" id="prevBtn" aria-label="Área anterior">←</button>
    <button class="pill icon zone-only" id="nextBtn" aria-label="Área siguiente">→</button>`;
  $('#backBtn').addEventListener('click',()=>goOverview());
  $('#prevBtn').addEventListener('click',()=>step(-1));
  $('#nextBtn').addEventListener('click',()=>step(1));
  tourBtn.addEventListener('click',()=>tour?stopTour():runTour());
  setTourBtn();
}
function updateHud(){
  document.body.classList.toggle('zone',mode==='zone');
  document.body.classList.toggle('aerial',mode==='aerial');
  bottombar.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.z===currentZone));
  bottombar.querySelector('.chip.active')?.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  zpanel.classList.remove('on');
  if(mode!=='zone') return;
  const z=ZBY[currentZone], i=ZONES.indexOf(z), as=AZ(z.id);
  const nov=as.filter(a=>SEV[a.estado]>0).length;
  zpanel.innerHTML=`<div class="kick">Área ${String(i+1).padStart(2,'0')} / ${String(ZONES.length).padStart(2,'0')}</div>
    <h2>${z.nombre}</h2><p class="desc">${z.desc} · ${as.length} equipos${nov?` · ${nov} con novedad`:''}</p>
    <div class="sec">Indicadores del área <i class="live" title="En vivo"></i></div>
    <div class="zk">${z.kpis.map(tile).join('')}</div>
    <div class="sec">Equipos</div>
    <ul>${as.map(a=>`<li><button data-a="${a.id}"><i class="dot" style="background:${ESTADOS[a.estado].c}"></i><span>${a.nombre}</span><em style="color:${ESTADOS[a.estado].c}">${a.estado}</em></button></li>`).join('')}</ul>`;
  zpanel.querySelectorAll('li button').forEach(b=>{
    const a=ASSETS.find(x=>x.id===b.dataset.a);
    b.addEventListener('click',()=>openAsset(a));
    b.addEventListener('mouseenter',()=>F().pins.querySelector(`[data-a="${a.id}"]`)?.classList.add('hl'));
    b.addEventListener('mouseleave',()=>F().pins.querySelector(`[data-a="${a.id}"]`)?.classList.remove('hl'));
  });
}

/* ============ Ficha de equipo ============ */
function openAsset(a){
  if(busy) return;
  selected=a;
  F().pins.querySelectorAll('.hs').forEach(h=>h.classList.toggle('sel',h.dataset.a===a.id));
  focusAsset(a);
  const c=ESTADOS[a.estado].c;
  const histHtml=a.hist.slice(0,2).map(h=>`<div><time>${h[0]}</time><span>${h[1]}</span></div>`).join('');
  card.innerHTML=`
    <button class="close" aria-label="Cerrar ficha">✕</button>
    <div class="head">
      <div class="glyph" style="background:${c}">${a.g}</div>
      <div class="tt"><h3>${a.nombre}</h3><p class="amb">${ZBY[a.st].nombre} · ${a.tipo}</p></div>
      <span class="badge" style="background:${c}22;color:${c}"><i class="dot" style="background:${c}"></i>${a.estado}</span>
    </div>
    <div class="health"><div class="lbl"><span>Índice de salud</span><span>${a.salud}%</span></div>
      <div class="bar"><i style="width:${a.salud}%;background:${a.salud>75?'var(--ok)':a.salud>45?'var(--warn)':'var(--bad)'}"></i></div></div>
    <div class="sec">Indicadores en tiempo real <i class="live" title="En vivo"></i></div>
    <div class="kpis">${a.kpis.map(tile).join('')}</div>
    ${a.nota?`<div class="note">${a.nota}</div>`:''}
    <div class="sec">Ficha técnica</div>
    <div class="specs">
      <div><span>Equipo / modelo</span><b>${a.marca}</b></div>
      <div><span>TAG</span><b>${a.serie}</b></div>
      <div><span>Criticidad</span><b>${a.criticidad}</b></div>
      <div><span>Puesta en marcha</span><b>${a.instalado}</b></div>
      <div><span>Última inspección</span><b>${a.ultInsp}</b></div>
      <div class="hot"><span>Próximo mant.</span><b>${a.proxMant}</b></div>
    </div>
    <div class="hist">${histHtml}</div>`;
  card.scrollTop=0;
  card.classList.add('on'); document.body.classList.add('carded');
  card.querySelector('.close').addEventListener('click',()=>closeCard());
}
/* Acercamiento suave al equipo, sin dejar ver bordes de la imagen */
function focusAsset(a,instant){
  const l=F(), fl=parseFloat(l.frame.style.left), ft=parseFloat(l.frame.style.top);
  const narrow=vw<760, s=narrow?1.35:1.45;
  const p=[fl+a.hx/100*fw, ft+a.hy/100*fh];
  const T=[narrow?vw*.5:vw*.4, narrow?vh*.2:vh*.44];
  const tx=clamp(T[0]-p[0]*s, vw-(fl+fw)*s, -fl*s);
  const ty=clamp(T[1]-p[1]*s, vh-(ft+fh)*s, -ft*s);
  l.foc.style.transition=(RM||instant)?'none':`transform 1.15s ${EASE}`;
  l.foc.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;
  l.pins.style.setProperty('--k',(1/s).toFixed(3));
}
function closeCard(){
  if(!selected) return;
  selected=null;
  card.classList.remove('on'); document.body.classList.remove('carded');
  const l=F();
  l.foc.style.transition=RM?'none':`transform 1s ${EASE}`; l.foc.style.transform='';
  l.pins.style.removeProperty('--k');
  l.pins.querySelectorAll('.hs.sel').forEach(h=>h.classList.remove('sel'));
}

/* ============ Recorrido automático ============ */
let tour=false, tourTimer=0, wake=null;
const sleep=ms=>new Promise(r=>{wake=r; tourTimer=setTimeout(r,ms);});
function setTourBtn(){
  tourBtn.classList.toggle('on',tour); tourBtn.setAttribute('aria-pressed',tour);
  tourBtn.innerHTML=tour?'■ <span class="only-wide">Detener recorrido</span>':'▶ <span class="only-wide">Recorrido</span>';
}
function stopTour(){ if(!tour) return; tour=false; clearTimeout(tourTimer); wake&&wake(); setTourBtn(); }
async function runTour(){
  if(busy) return;
  tour=true; setTourBtn();
  for(const z of ZONES){
    await goZone(z.id); if(!tour) return;
    await sleep(1400); if(!tour) return;
    const w=[...AZ(z.id)].sort((a,b)=>SEV[b.estado]-SEV[a.estado])[0];
    if(SEV[w.estado]>0){
      openAsset(w); await sleep(4200); if(!tour) return;
      closeCard(); await sleep(900); if(!tour) return;
    } else { await sleep(2800); if(!tour) return; }
  }
  await goOverview();
  tour=false; setTourBtn();
}
addEventListener('pointerdown',e=>{ if(tour&&!e.target.closest('#tourBtn')) stopTour(); },true);

/* ============ Interacción: arrastre, paralaje, teclado ============ */
let drag=null, dragged=false;
stage.addEventListener('pointerdown',e=>{
  if(busy) return;
  drag={x:e.clientX,y:e.clientY,px:F().px,py:F().py}; dragged=false;
});
addEventListener('pointermove',e=>{
  if(drag){
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(!dragged&&Math.hypot(dx,dy)>6) dragged=true;
    if(dragged){ const l=F(); l.px=drag.px+dx; l.py=drag.py+dy; place(l); }
    return;
  }
  if(e.pointerType!=='mouse'||RM||busy) return;
  const dx=e.clientX/vw-.5, dy=e.clientY/vh-.5;
  F().par.style.transform=`translate(${(-dx*18).toFixed(1)}px,${(-dy*12).toFixed(1)}px)`;
});
addEventListener('pointerup',()=>{ drag=null; });
addEventListener('pointercancel',()=>{ drag=null; });
stage.addEventListener('click',e=>{ if(dragged){ e.stopPropagation(); e.preventDefault(); dragged=false; } },true);
addEventListener('keydown',e=>{
  if(e.key!=='Tab') stopTour();
  if(mode==='zone'&&e.key==='ArrowRight') step(1);
  if(mode==='zone'&&e.key==='ArrowLeft') step(-1);
  if(e.key==='Escape'){ if(selected) closeCard(); else if(mode==='zone') goOverview(); }
});
addEventListener('resize',layout);

/* ============ Arranque: intro tipo drone ============ */
const preload=[];
async function boot(){
  busy=true;
  buildStatic(); layout();
  setView(L[0],{type:'aerial'}); panTo(L[0],54,50); L[0].el.classList.add('front'); L[0].el.style.opacity='1'; L[0].el.style.zIndex=1;
  await L[0].img.decode().catch(()=>{});
  ZONES.forEach(z=>{ const i=new Image(); i.src=imgOf({type:'zone',id:z.id}); preload.push(i); });
  $('#intro').classList.add('gone');
  if(!RM){
    L[0].el.classList.add('busy'); document.body.classList.add('cine');
    await play(L[0].el,[{transform:'scale(1.55) translateY(5%)',filter:'blur(14px)',opacity:0},{opacity:1,offset:.3},
      {transform:'scale(1) translateY(0)',filter:'blur(0px)',opacity:1}],3200,'cubic-bezier(.2,.65,.1,1)');
    L[0].el.getAnimations().forEach(x=>x.cancel());
    L[0].el.classList.remove('busy'); document.body.classList.remove('cine');
  }
  document.body.classList.add('ready');
  busy=false;
}
boot();
</script>
